name: Deploy Next.js Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Next.js Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PASSWORD  }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -e

            echo "======================================"
            echo "🚀 Starting Next.js deployment"
            echo "======================================"

            echo "📌 Node Version:"
            node -v

            echo "📌 NPM Version:"
            npm -v

            echo "📌 PM2 Version:"
            pm2 -v

            cd /home/bitnami/htdocs/grass2026/frontend

            echo "📂 Current directory:"
            pwd

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📦 Installing dependencies..."
            npm ci

            echo "🏗️ Building Next.js application..."
            npm run build

            echo "♻️ Restarting Next.js application..."

            if pm2 describe grass-frontend > /dev/null 2>&1; then
              pm2 restart grass-frontend
            else
              pm2 start npm --name grass-frontend -- start
            fi

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "📊 PM2 Status:"
            pm2 status

            echo "======================================"
            echo "✅ Next.js deployment successful"
            echo "======================================"
